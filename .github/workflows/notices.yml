name: notices
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: patch-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 2026-10-30 쓰기 락: 다른 배포(PC 공개·검토 배포)와 겹쳐 push가 거절되면 최신 main에서 다시 만든다(3회).
      - id: gen
        run: |
          for i in 1 2 3; do
            python .github/notice_map.py --main-map onp_master_map.bin --map onp_notice_map.bin --out .github/notice \
              --update-json update.json --base-url https://raw.githubusercontent.com/${{ github.repository }}/main/ | tee gen.log
            changed=0; if grep -q '^NOTICE_CHANGED' gen.log; then changed=1; fi
            rm -f gen.log
            git add -A onp_notice_map.bin update.json .github/notice
            if git diff --cached --quiet; then echo "changed=$changed" >> "$GITHUB_OUTPUT"; exit 0; fi
            git -c user.name=ournotes-ko -c user.email=noreply@ournotes-ko.invalid commit -q -m "[notice] refresh notice map"
            if git push -q; then echo "changed=$changed" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push 거절(다른 배포와 겹침) -> 최신 main에서 다시 $i/3"
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
          done
          exit 1
      - if: steps.gen.outputs.changed == '1'
        run: pip install google-auth requests && python .github/fcm_send.py - update.json --topic updates
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
      # 2026-10-23 사용자 선택(실패 푸시): 매시간 도는 작업이라 두 번 연속 실패할 때만 개발용 푸시를 보낸다(한 번은 다음 실행을 기다림).
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FCM_SA: ${{ secrets.FCM_SA }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" -w notices.yml -L 5 --json databaseId,status,conclusion \
            --jq "[.[] | select(.status == \"completed\" and .databaseId != $GITHUB_RUN_ID)][0].conclusion")
          echo "이전 실행: $prev"
          if [ "$prev" != failure ]; then echo "한 번 실패: 다음 실행을 기다림"; exit 0; fi
          pip install -q google-auth requests
          python .github/fcm_send.py - - --dev "patch-data 확인 필요(아워 노트)" "공지 번역 갱신(notices)이 두 번 연속 실패" --url "$URL"
